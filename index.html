<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#bb4d00" />
    <title>Family Tree Generator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Applies the saved theme before first paint. Without this a dark-mode
      // user gets a white flash on every load, because React mounts too late to
      // set the class in time. The key and shape must match
      // app/lib/ui/theme-store.ts.
      try {
        var saved = localStorage.getItem("familytree:theme")
        var theme = saved ? JSON.parse(saved).state.theme : "system"
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch (error) {
        // A blocked or malformed store just means the default light theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
